name: Shopee Cookie Health Check

on:
  # Check every Sunday at 3 AM UTC = 10:00 WIB
  schedule:
    - cron: '0 3 * * 0'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # ── Auto Cookie Refresh (PRIMARY METHOD) ─────────────────────
      # Gets fresh cookies via auto-login before health check
      - name: Auto-refresh Affiliate Cookies
        if: ${{ secrets.SHOPEE_USERNAME != '' }}
        env:
          SHOPEE_USERNAME: ${{ secrets.SHOPEE_USERNAME }}
          SHOPEE_PASSWORD: ${{ secrets.SHOPEE_PASSWORD }}
        run: |
          echo "=== Auto-login: getting fresh cookies ==="
          pip install playwright
          playwright install chromium --with-deps
          cd engine/modules
          python shopee_auto_login.py
        continue-on-error: true

      - name: Check Cookie Health
        id: cookie_check
        env:
          SHOPEE_AFFILIATE_COOKIES: ${{ env.SHOPEE_AFFILIATE_COOKIES || secrets.SHOPEE_AFFILIATE_COOKIES }}
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_KEY: ${{ secrets.CF_PROXY_KEY_API }}
        run: |
          python -c "
          import os, json, sys, time

          cookies_raw = os.environ.get('SHOPEE_AFFILIATE_COOKIES', '')
          proxy_url = os.environ.get('CF_PROXY_URL', '')
          proxy_key = os.environ.get('CF_PROXY_KEY', '')

          # Check 1: Cookies exist?
          if not cookies_raw:
              print('STATUS=NO_COOKIES')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=NO_COOKIES\n')
                  f.write('message=SHOPEE_AFFILIATE_COOKIES not available. Set SHOPEE_USERNAME+PASSWORD for auto-login.\n')
              sys.exit(0)

          # Check 2: Cookies valid JSON?
          try:
              cookies = json.loads(cookies_raw)
              if isinstance(cookies, list):
                  count = len(cookies)
              elif isinstance(cookies, dict):
                  count = len(cookies)
              else:
                  count = 0
              print(f'Cookies: {count} entries, {len(cookies_raw)} chars')
          except:
              print('STATUS=INVALID_JSON')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=INVALID_JSON\n')
                  f.write('message=SHOPEE_AFFILIATE_COOKIES is not valid JSON. Please re-export.\n')
              sys.exit(0)

          # Check 3: Check if all cookies expired
          if isinstance(cookies, list):
              now = time.time()
              expired = sum(1 for c in cookies if c.get('expirationDate', 0) and c.get('expirationDate', 0) < now and not c.get('session', False))
              total = len(cookies)
              if expired > 0:
                  print(f'{expired}/{total} cookies expired')
              if expired == total and total > 0:
                  print('ALL cookies expired!')

          # Check 4: Test affiliate API via proxy (Komisi XTRA endpoint)
          import requests
          test_url = 'https://affiliate.shopee.co.id/api/v3/offer/shop/list?sort_type=1&page_offset=0&page_limit=1&keyword=tas'
          headers_dict = {
              'User-Agent': 'Mozilla/5.0 (Linux; Android 14) Chrome/121.0',
              'Accept': 'application/json',
              'Referer': 'https://affiliate.shopee.co.id/offer/brand_offer',
              'Origin': 'https://affiliate.shopee.co.id',
          }

          cookie_str = ''
          if isinstance(cookies, list):
              cookie_str = '; '.join([f\"{c.get('name','')}={c.get('value','')}\" for c in cookies if c.get('name')])
          elif isinstance(cookies, dict):
              cookie_str = '; '.join([f'{k}={v}' for k, v in cookies.items()])

          # Try via proxy if available
          success = False
          api_code = None
          if proxy_url and proxy_key:
              try:
                  resp = requests.post(
                      f'{proxy_url}/proxy',
                      json={'url': test_url, 'method': 'GET', 'headers': headers_dict, 'cookies': cookie_str},
                      headers={'X-Proxy-Key': proxy_key, 'Content-Type': 'application/json'},
                      timeout=20
                  )
                  print(f'Proxy test: HTTP {resp.status_code}')
                  if resp.status_code == 200:
                      try:
                          data = resp.json()
                          api_code = data.get('code', '?')
                          api_msg = data.get('msg', '?')
                          print(f'API response: code={api_code}, msg={api_msg}')
                          if api_code == 0:
                              shops = data.get('data', {}).get('list', [])
                              total = data.get('data', {}).get('total_count', 0)
                              print(f'Affiliate API OK: {len(shops)} shops (total {total})')
                              success = True
                          elif api_code == 30002:
                              print('>>> Cookies EXPIRED (code=30002, cookie incorrect)')
                          else:
                              print(f'>>> API error: code={api_code}')
                      except:
                          print('Response is not JSON')
                  elif resp.status_code == 401:
                      print('>>> PROXY_SECRET mismatch')
              except Exception as e:
                  print(f'Proxy test failed: {e}')

          if success:
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=HEALTHY\n')
                  f.write(f'message=Affiliate cookies OK ({count} entries), API working.\n')
          else:
              detail = f'API code={api_code}' if api_code else 'no response'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('status=EXPIRED\n')
                  f.write(f'message=Affiliate cookies EXPIRED or invalid ({detail}). Please update SHOPEE_AFFILIATE_COOKIES.\n')
          "

      - name: Send Alert Email (if unhealthy)
        if: steps.cookie_check.outputs.status != 'HEALTHY'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ Shopee Affiliate Cookies Alert — ${{ steps.cookie_check.outputs.status }}"
          to: ic31122025@gmail.com
          from: Affiliate Engine <${{ secrets.EMAIL_USERNAME }}>
          body: |
            ⚠️ SHOPEE AFFILIATE COOKIES STATUS: ${{ steps.cookie_check.outputs.status }}

            ${{ steps.cookie_check.outputs.message }}

            Solusi paling mudah:
            Set SHOPEE_USERNAME + SHOPEE_PASSWORD di GitHub Secrets
            untuk auto-login otomatis (tidak perlu manual cookie update).

            Manual update (jika auto-login gagal):
            1. Login ke https://affiliate.shopee.co.id di browser
            2. Buka halaman Komisi XTRA (/offer/brand_offer)
            3. Export semua cookies sebagai JSON (pakai Cookie Editor extension)
            4. Update secret SHOPEE_AFFILIATE_COOKIES di:
               https://github.com/Woiiiiiiiii/naon-nya/settings/secrets/actions

            Cek dilakukan: Setiap Minggu jam 10:00 WIB
            Run: https://github.com/Woiiiiiiiii/naon-nya/actions

      - name: Log Result
        if: always()
        run: |
          echo "=== Cookie Health Check Result ==="
          echo "Status: ${{ steps.cookie_check.outputs.status }}"
          echo "Message: ${{ steps.cookie_check.outputs.message }}"
