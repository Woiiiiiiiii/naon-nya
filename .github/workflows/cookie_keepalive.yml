name: Cookie Keep-Alive

on:
  # Run every 2 hours to keep cookies fresh
  schedule:
    - cron: '0 */2 * * *'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh Cookies
        env:
          SHOPEE_AFFILIATE_COOKIES: ${{ secrets.SHOPEE_AFFILIATE_COOKIES }}
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_KEY: ${{ secrets.CF_PROXY_KEY_API }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          cd engine/modules
          python cookie_refresher.py
