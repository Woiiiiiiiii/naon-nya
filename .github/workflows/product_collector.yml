name: Product Collector

on:
  # Manual trigger only — user updates cookies + triggers together
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to collect (leave empty for all)'
        required: false
        default: ''
      target:
        description: 'Target products per category'
        required: false
        default: '20'

# IMPORTANT: workflow-level permissions for git push
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests Pillow

      # ── Restore cached cookies (PRIVATE, not in public repo) ──
      - name: Restore Shopee Cookies Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.shopee_cookies.json
          key: shopee-cookies-${{ github.run_number }}
          restore-keys: |
            shopee-cookies-

      # ── Auto Cookie Refresh via API (no browser needed) ─────────
      # Makes a Shopee product API call → captures Set-Cookie headers
      # → saves refreshed tokens back to secret + GITHUB_ENV
      - name: Auto-refresh Affiliate Cookies
        env:
          SHOPEE_AFFILIATE_COOKIES: ${{ secrets.SHOPEE_AFFILIATE_COOKIES }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$SHOPEE_AFFILIATE_COOKIES" ]; then
            echo "SHOPEE_AFFILIATE_COOKIES not set — skipping refresh"
            exit 0
          fi
          echo "=== Cookie refresh via API ==="
          cd engine/modules
          python cookie_refresher.py
        continue-on-error: true

      # ── Auto-update secret with refreshed cookies (gh CLI) ─────
      # ONLY if session was verified valid (marker file exists)
      - name: Update Cookies Secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT not set — skipping secret update"
            exit 0
          fi
          if [ ! -f /tmp/.cookies_session_valid ]; then
            echo "Session was not valid — NOT updating secret (keeping old one)"
            exit 0
          fi
          if [ -f /tmp/.shopee_cookies.json ]; then
            gh secret set SHOPEE_AFFILIATE_COOKIES < /tmp/.shopee_cookies.json
            echo "✅ SHOPEE_AFFILIATE_COOKIES secret updated!"
          else
            echo "No cached cookies to save"
          fi
        continue-on-error: true

      - name: Load Cookies from Cache
        if: always()
        run: |
          # ONLY load cache if session was validated (marker exists)
          # Otherwise old expired cache overrides fresh secret!
          if [ ! -f /tmp/.cookies_session_valid ]; then
            echo "Session not valid — using secret directly (not loading old cache)"
            exit 0
          fi
          for f in /tmp/.shopee_cookies.json /tmp/affiliate_cookies.json; do
            if [ -f "$f" ]; then
              echo "SHOPEE_AFFILIATE_COOKIES<<EOF" >> $GITHUB_ENV
              cat "$f" >> $GITHUB_ENV
              echo "" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              echo "✅ Loaded cookies from $f"
              break
            fi
          done

      - name: Collect Products
        env:
          SHOPEE_AFFILIATE_COOKIES: ${{ env.SHOPEE_AFFILIATE_COOKIES || secrets.SHOPEE_AFFILIATE_COOKIES }}
          CF_PROXY_URL: ${{ secrets.CF_PROXY_URL }}
          CF_PROXY_KEY: ${{ secrets.CF_PROXY_KEY_API }}
        run: |
          cd engine/modules
          if [ -n "${{ github.event.inputs.category }}" ]; then
            python product_collector.py --category "${{ github.event.inputs.category }}" --target ${{ github.event.inputs.target || '20' }}
          else
            python product_collector.py --target ${{ github.event.inputs.target || '20' }}
          fi

      - name: Show Bank Status
        if: always()
        run: |
          echo "=== Product Bank Status ==="
          find engine/data/product_bank -name 'image.jpg' 2>/dev/null | wc -l
          echo "products with images"
          for cat in fashion gadget beauty home wellness; do
            count=$(find "engine/data/product_bank/$cat" -name 'image.jpg' 2>/dev/null | wc -l)
            echo "  $cat: $count products"
          done

      - name: Commit Product Bank
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/data/product_bank/ engine/data/produk.csv engine/data/images/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new products collected — nothing to commit"
            exit 0
          else
            git commit -m "🛍️ Product bank update: $(date +%Y-%m-%d)"
            git push origin main || echo "Push failed (branch protection?) — products saved in cache"
            echo "Product bank updated and pushed!"
          fi
